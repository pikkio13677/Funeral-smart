services:
  - type: web
    name: funeral-smart-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: funeral-smart-db
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_VERIFICATION_PEPPER
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ENABLE_MULTI_TENANT
        value: "false"

databases:
  - name: funeral-smart-db
    plan: free
    databaseName: funeral_smart
    user: funeral_smart_user
