services:
  - type: web
    name: funeral-smart-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: funeral-smart-db
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false

  - type: web
    name: funeral-smart-web
    runtime: static
    buildCommand: echo "Publishing FUNERAL SMART"
    staticPublishPath: ./public
    domains:
      - funeralsmartapp.com

databases:
  - name: funeral-smart-db
    plan: free
    databaseName: funeral_smart
    user: funeral_smart_user
