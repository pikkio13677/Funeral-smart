name: Funeral Smart checks
on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run check
