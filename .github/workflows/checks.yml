name: Funeral Smart checks
on:
  push:
    branches: [main, "feature/**", "fix/**", "security/**"]
  pull_request:
    branches: [main, "fix/**"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
