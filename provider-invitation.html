<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>FUNERAL SMART · Accetta invito</title>
<style>body{margin:0;background:#f4f6f7;color:#202b36;font:15px/1.5 system-ui}header{background:#173b35;color:white;padding:20px}main{max-width:650px;margin:30px auto;padding:16px}.panel{background:white;border:1px solid #e4e9ed;border-radius:14px;padding:22px}label{display:block;margin:12px 0 5px;font-size:13px}input{width:100%;padding:11px;border:1px solid #d5dfe3;border-radius:8px;box-sizing:border-box}button{background:#176b52;color:white;border:0;border-radius:8px;padding:12px;font-weight:700}.hidden{display:none!important}.msg{padding:12px;background:#fff3df;color:#715b31;border-radius:8px;margin-top:12px}.ok{background:#e7f3ee;color:#176b52}
/* FUNERAL SMART — black, ivory and gold design system */
:root{--brand-ink:#191817;--brand-ink2:#302d29;--brand-gold:#c9ad78;--brand-paper:#f5f1e8;--brand-text:#28251f;--brand-muted:#746e64;--brand-line:#e5ddcf;--brand-shadow:0 14px 38px rgba(38,31,22,.075)}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 0%,#fffdf8 0,var(--brand-paper) 68%);color:var(--brand-text)}
header,.top{background:linear-gradient(118deg,#171615 0%,#282521 62%,#40372b 100%);color:#fff}
header h1,.brand strong{letter-spacing:.13em}
.sub,.tag,.brand small{color:#ddc99f}
.panel,.card,.stat,.module,.step,.overview-panel{border:1px solid var(--brand-line);border-radius:18px;box-shadow:var(--brand-shadow);background:rgba(255,253,248,.97)}
h1,h2,h3,.welcome h1,.card h3{letter-spacing:-.02em}
h2,h3,.welcome h1{font-family:Georgia,'Times New Roman',serif;font-weight:400}
input,select,textarea{border:1px solid #ded5c5;border-radius:12px;background:#fffefa;color:var(--brand-text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#b99a67;box-shadow:0 0 0 3px rgba(201,173,120,.17)}
button,.btn{border-radius:999px;transition:transform .16s ease,box-shadow .16s ease}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px #0002}
button.primary,.btn,.btn.primary{background:#25221e;color:#fff;border-color:#25221e}
button.gold,.btn.gold{background:linear-gradient(135deg,#d9c49a,#b99861);color:#211d17;border-color:#b99861}
button.alt,.btn.alt{background:#f3eee4;color:#51432e;border:1px solid #e5dac5}
button.danger,.btn.danger{background:#8e3932;color:#fff}
.tab.active{background:#25221e;color:#ead9b5;border-color:#25221e}
.stat b,.stat strong,.stat strong{color:#826638}
.muted,.hint,.stat small{color:#81786d}
.notice,.msg{border-radius:13px}
@media(max-width:700px){.wrap{padding-left:15px;padding-right:15px}.stats,.analytics-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.panel,.module{padding:16px}.toolbar input{min-width:0;width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}

</style></head>
<body><header><b>FUNERAL SMART</b><div>Portale imprese partner</div></header><main><section class="panel">
<h1>Accetta l’invito dell’impresa</h1><p>Accedi con il tuo account attivo usando l’indirizzo email verificato a cui è stato inviato l’invito.</p>
<form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Accedi</button></form>
<form id="mfa" class="hidden"><label for="code">Codice Authenticator o recupero</label><input id="code" autocomplete="one-time-code" required><button>Verifica</button></form>
<div id="session" class="hidden"><p id="who"></p><button id="accept">Accetta invito</button></div><div id="message" class="msg hidden" role="status"></div>
<p>Il link è personale e scade dopo 72 ore. Se è scaduto, chiedi un nuovo invito.</p></section></main>
<script>
'use strict';
const token=new URLSearchParams(location.search).get('token')||'';
const el=id=>document.getElementById(id);
let accepting=false;
if(token)history.replaceState({},document.title,location.pathname);
function show(t,ok){el('message').textContent=t;el('message').className='msg'+(ok?' ok':'');}
async function api(path,options){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options&&options.headers||{})}});const d=await r.json().catch(()=>({error:'Risposta non valida'}));if(!r.ok)throw new Error(d.error||'Operazione non riuscita');return d;}
async function refresh(){const d=await api('/api/v1/auth/me');el('who').textContent='Accesso effettuato come '+(d.data.displayName||d.data.username)+'.';el('session').classList.remove('hidden');el('login').classList.add('hidden');}
async function accept(){
  if(!/^[A-Za-z0-9_-]{43}$/.test(token))throw new Error('Link di invito non valido');
  if(accepting)return;
  accepting=true;
  const button=el('accept');
  button.disabled=true;
  button.setAttribute('aria-busy','true');
  try{
    const d=await api('/api/v1/provider-portal/invitations/accept',{method:'POST',body:JSON.stringify({token})});
    show(d.message||'Invito accettato',true);
    setTimeout(()=>location.assign('/provider/portale'),900);
  }catch(error){
    accepting=false;
    button.disabled=false;
    button.removeAttribute('aria-busy');
    throw error;
  }
}
el('login').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({username:el('username').value.trim(),password:el('password').value})});el('password').value='';if(d.mfaRequired){el('login').classList.add('hidden');el('mfa').classList.remove('hidden');}else await refresh();}catch(x){show(x.message,false);}});
el('mfa').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/v1/auth/mfa/verify-login',{method:'POST',body:JSON.stringify({code:el('code').value.trim()})});el('mfa').classList.add('hidden');await refresh();}catch(x){show(x.message,false);}});
el('accept').addEventListener('click',async()=>{try{await accept();}catch(x){show(x.message,false);}});
(async()=>{if(!/^[A-Za-z0-9_-]{43}$/.test(token)){show('Link mancante o non valido. Richiedi un nuovo invito.',false);return;}try{await refresh();}catch(_){}})();
</script></body></html>
