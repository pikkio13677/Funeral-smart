<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>FUNERAL SMART · Gestione richieste</title>
<style>
:root{color-scheme:light}body{margin:0;background:#f4f6f2;color:#202b26;font:15px/1.5 system-ui}header{background:#123b32;color:white;padding:18px 22px}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e7e0;border-radius:14px;padding:18px;margin:16px 0}.muted{color:#68756e;font-size:13px}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select{font:inherit;padding:11px;border:1px solid #d5ded6;border-radius:9px;max-width:100%}button{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:#123b32;color:white;font-weight:700;cursor:pointer}button.alt{background:#edf3ed;color:#123b32;border:1px solid #d9e3da}button:disabled{opacity:.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.item{padding:14px 0;border-bottom:1px solid #e1e7e0;display:grid;grid-template-columns:1fr minmax(230px,auto);gap:14px}.item:last-child{border:0}.meta{font-size:12px;color:#68756e}.msg{padding:12px;border-radius:9px;background:#fff3df;color:#70572c;margin:12px 0}.ok{background:#e7f3ee;color:#176b52}.hidden{display:none!important}@media(max-width:650px){.item{grid-template-columns:1fr}}
</style></head><body><header><b>FUNERAL SMART</b><div>Console staging · Richieste famiglie</div></header>
<main><section class="panel" id="loginPanel"><h1>Accesso amministratore</h1><p class="muted">Area riservata al database MariaDB di staging.</p><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Accedi</button></p></form></section>
<section class="panel hidden" id="console"><div class="row"><div style="flex:1"><h1>Richieste delle famiglie</h1><p class="muted">Assegna ogni richiesta a una sola impresa verificata. Ogni operazione viene registrata.</p></div><button class="alt" id="refresh">Aggiorna</button><button class="alt" id="logout">Esci</button></div><div id="message" class="msg hidden" role="status"></div><div class="row"><div><label for="status">Stato</label><select id="status"><option value="">Tutte le aperte</option><option value="received">Ricevute</option><option value="reviewed">Esaminate</option><option value="assigned">Assegnate</option><option value="closed">Chiuse</option></select></div></div><div id="list">Caricamento…</div></section></main>
<script>
'use strict';
const API='/api/v1',el=id=>document.getElementById(id);let providers=[];
async function api(path,options={}){const r=await fetch(API+path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({error:'Risposta non valida'}));if(!r.ok)throw new Error(d.error||'Operazione non riuscita');return d;}
function message(text,ok=false){el('message').textContent=text;el('message').className='msg'+(ok?' ok':'');}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
async function load(){try{const [p,i]=await Promise.all([api('/platform/providers'),api('/platform/inquiries?limit=200'+(el('status').value?'&status='+encodeURIComponent(el('status').value):''))]);providers=p.data||[];const list=el('list');list.replaceChildren();if(!i.data.length){list.append(node('p','Nessuna richiesta.','muted'));return;}for(const item of i.data){const card=node('article',undefined,'item'),left=node('div'),title=node('b',(item.city||'Comune non indicato')+' · '+(item.serviceType||'Servizio')),meta=node('div',(item.contactEmail||'')+(item.contactPhone?' · '+item.contactPhone:'')+' · '+new Date(item.createdAt).toLocaleString('it-IT'),'meta'),status=node('div','Stato: '+item.status+' · '+(item.assignedProviderName?'Impresa: '+item.assignedProviderName:'Non assegnata'),'meta');left.append(title,meta,status);if(item.notes)left.append(node('p',item.notes));if(item.destinationCountry)left.append(node('div','Destinazione: '+item.destinationCountry,'meta'));card.append(left);const actions=node('div');if(['received','reviewed','assigned'].includes(item.status)&&!item.assignedProviderId){const select=node('select');select.append(new Option('Seleziona impresa verificata',''));for(const p of providers.filter(x=>x.status==='verified'))select.append(new Option(p.businessName+' · '+p.city,p.id));const assign=node('button','Assegna');assign.disabled=!providers.some(x=>x.status==='verified');assign.addEventListener('click',async()=>{if(!select.value){message('Seleziona un’impresa verificata.');return;}const reason=window.prompt('Motivazione (almeno 10 caratteri):');if(reason===null)return;if(reason.trim().length<10){message('La motivazione deve contenere almeno 10 caratteri.');return;}if(!window.confirm('Confermi l’assegnazione?'))return;assign.disabled=true;try{await api('/platform/inquiries/'+encodeURIComponent(item.id)+'/assign',{method:'POST',body:JSON.stringify({providerId:select.value,reason:reason.trim()})});message('Richiesta assegnata.',true);await load();}catch(e){message(e.message);assign.disabled=false;}});actions.append(select,assign);}if(item.status==='received'){const review=node('button','Segna esaminata','alt');review.addEventListener('click',()=>changeStatus(item.id,'reviewed'));actions.append(review);}if(['received','reviewed','assigned'].includes(item.status)){const close=node('button','Chiudi','alt');close.addEventListener('click',()=>changeStatus(item.id,'closed'));actions.append(close);}const history=node('button','Storico','alt');history.addEventListener('click',async()=>{try{const h=await api('/platform/inquiries/'+encodeURIComponent(item.id)+'/assignments');window.alert((h.data||[]).map(x=>new Date(x.assignedAt).toLocaleString('it-IT')+' — '+x.providerName+' — '+x.status+(x.revocationReason?' — '+x.revocationReason:'')).join('\n')||'Nessuna assegnazione.');}catch(e){message(e.message);}});actions.append(history);card.append(actions);list.append(card);}}catch(e){message(e.message);}}
async function changeStatus(id,status){const reason=window.prompt('Motivazione (almeno 10 caratteri):');if(reason===null)return;if(reason.trim().length<10){message('La motivazione deve contenere almeno 10 caratteri.');return;}if(!window.confirm('Confermi la modifica?'))return;try{await api('/platform/inquiries/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status,reason:reason.trim()})});message('Stato aggiornato.');await load();}catch(e){message(e.message);}}
async function session(){const me=await api('/auth/me');if(!['admin','platform_owner'].includes(me.data.role))throw new Error('Account non autorizzato.');el('loginPanel').classList.add('hidden');el('console').classList.remove('hidden');await load();}
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/auth/login',{method:'POST',body:JSON.stringify({username:el('username').value.trim(),password:el('password').value})});el('password').value='';await session();}catch(x){message(x.message);}});
el('refresh').addEventListener('click',load);el('status').addEventListener('change',load);el('logout').addEventListener('click',async()=>{try{await api('/auth/logout',{method:'POST',body:'{}'});}catch{}location.reload();});
session().catch(()=>{});
</script></body></html>
