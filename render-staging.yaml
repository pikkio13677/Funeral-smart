# Blueprint separato per il collaudo: non usare il database di produzione.
# DATABASE_URL viene configurato manualmente con un database PostgreSQL esterno dedicato allo staging.
# npm start esegue solo le migrazioni base 001-004 definite in migrate.js.
# Le migrazioni draft 005-015 e i moduli tenant/provider restano disattivati.
services:
  - type: web
    name: funeral-smart-api-staging
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAGING_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_VERIFICATION_PEPPER
        sync: false
      - key: CORS_ORIGIN
        value: https://funeral-smart-web-staging-cszq.onrender.com
      - key: PUBLIC_APP_URL
        value: https://funeral-smart-web-staging-cszq.onrender.com
      - key: ENABLE_MULTI_TENANT
        value: "false"
      - key: MULTI_TENANT_CUTOVER_APPROVED
        value: "false"
      - key: ENABLE_PROVIDER_PORTAL
        value: "false"

  - type: web
    name: funeral-smart-web-staging
    runtime: static
    buildCommand: sed -i 's#https://funeral-smart-api.onrender.com#https://funeral-smart-api-staging-cszq.onrender.com#g' public/api-config.js && echo "Publishing FUNERAL SMART staging"
    staticPublishPath: ./public
